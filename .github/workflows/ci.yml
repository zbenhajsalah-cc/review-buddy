name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # The backend SHIPS on Node (dist/cli.mjs) even though it is developed on
      # Bun — pin the runtime floor here so the bundle is exercised on the
      # oldest version package.json's `engines` claims to support.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.11'
      - name: Install (backend)
        run: bun install --frozen-lockfile
      - name: Install (UI)
        run: bun install --frozen-lockfile --cwd src/ui
      # verify:ci ends with verify:dist-fresh: after build:ui and build:dist
      # rebuild the committed artifacts, it fails if src/ui/dist or dist/ drifted
      # from git — i.e. a PR changed source without committing the rebuild.
      - name: Verify (tests + typechecks + builds + committed-artifact freshness)
        run: bun run verify:ci
