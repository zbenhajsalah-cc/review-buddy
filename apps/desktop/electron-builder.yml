# Packaging (US-09 checked the Agent SDK in a packaged app; US-18 makes it an
# installable app). The app runs the user's own installed Claude Code (US-21),
# so the SDK's Claude Code binary is left out. Build on the OS you install on.
#   pnpm --filter desktop dist      installer for this OS in release/
#   pnpm --filter desktop package   unpacked app only (quick checks)
appId: dev.review-buddy.desktop
productName: Review Buddy
executableName: review-buddy
# No spaces in file names: review-buddy-0.4.0-x86_64.AppImage, …-arm64.dmg, …
artifactName: review-buddy-${version}-${arch}.${ext}
# No auto-update feed (personal use).
publish: null
directories:
  output: release
  # icon.png (1024 px, rendered from icon.svg); electron-builder makes the
  # .icns and .ico from it.
  buildResources: build
# main, preload and renderer are bundled into out/. electron-builder adds the
# production `dependencies` (only the Agent SDK) from node_modules.
files:
  - out/**/*
  - package.json
  # The SDK's per-platform packages hold its own Claude Code binary (about
  # 246 MB): not shipped, the app runs the installed one (US-21).
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
linux:
  # One file, no root: chmod +x and run (or let an AppImage launcher add it
  # to the menu). A .deb would need a maintainer e-mail address.
  target: AppImage
  category: Development
  synopsis: Narrative code review of GitHub pull requests
  # The window belongs to the menu entry (desktopName in package.json).
  syncDesktopName: true
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # No Apple Developer ID (personal use): sign ad hoc, which Apple Silicon
  # needs to run the app at all, without the hardened runtime (only needed
  # for notarization).
  identity: "-"
  hardenedRuntime: false
win:
  target: nsis
nsis:
  # A per-user install, no admin rights; a shortcut in the Start menu.
  oneClick: true
  perMachine: false
